# Ablation: 슬라이딩 윈도우 hop 크기 (overlap 비율)
# 작은 hop → 높은 overlap → 샘플 수 증가 (데이터 증강)
base_config: "configs/default.yaml"

sweep:
  - param: "sliding_window.hop_sec"
    values: [0.5, 1.0, 1.25, 1.8]
    # 0.5s → 80% overlap, 1.0s → 60% overlap, 1.5s → 40% overlap

overrides:
  sliding_window.enabled: true
  sliding_window.window_sec: 2.5
  experiment.steps: [preprocess, sanitize, extract, train]
