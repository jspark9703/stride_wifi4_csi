# Ablation: PCA 첫 번째 주성분 제거 여부
# del_pca_1=true : PC1(데이터 평균/DC 성분)을 제거하고 PC2~PC(n_pca+1)로 특징 추출
# del_pca_1=false: 기존 방식 (PC1~PCn_pca 모두 사용)
# 제거 효과: 정적 배경 제거, 동적 보행 성분 강조
base_config: "configs/baseline.yaml"

sweep:
  - param: "feature_extraction.dwt.del_pca_1"
    values: [true, false]

overrides:
  experiment.steps: [extract, train]
